[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pre-existing violations surfaced when ruff was first wired into CI (#2).
# Each is intentional or out of scope for that change; revisit in dedicated PRs.
ignore = [
    "DTZ001",  # Local wall-clock times; tz-aware datetimes aren't needed for in-game timestamps
    "DTZ007",  # Parsing upstream-provided timestamps that carry no zone info
    "BLE001",  # Broad excepts guard external integrations; narrowing is out of scope
    "S110",    # Best-effort optional operations; failure to act is acceptable
    "ISC004",  # Intentional multi-line string literals in collections for readability
    "PLR0124", # Self-comparison guard; revisit in a dedicated logic fix
]
