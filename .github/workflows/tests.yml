name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .
