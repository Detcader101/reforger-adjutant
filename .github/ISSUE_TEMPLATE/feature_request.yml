name: Feature request
description: Something the bot should be able to do and can't.
labels: ["type: feature", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Read [`docs/SPEC.md`](../../docs/SPEC.md) first — the product principles
        rule some things out on purpose, and dashboards, cross-guild federation,
        stats/ELO and voice features are explicitly out of scope.

        The command surface is **eight top-level commands** and
        `tests/test_command_metadata.py` enforces it. A ninth is a decision to
        argue here, not something a PR adds quietly.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What a community can't do today. Describe the situation, not the solution.
      placeholder: >
        Event announcements land in whatever channel the organiser happened to
        type in, so half the guild misses them.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like instead
      description: Where it attaches — an argument on an existing command, a button, a modal.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area
      options:
        - setup
        - ranks
        - teams
        - events
        - map
        - serverlink
        - admin
        - infra
        - voice / UX
        - not sure
    validations:
      required: true

  - type: checkboxes
    id: principles
    attributes:
      label: Principle check
      description: Tick what applies. If you can't tick the first, say why below.
      options:
        - label: This is opt-in — a guild that doesn't want it is unaffected
        - label: It doesn't require the bot to hold Administrator
        - label: It can't leak one team's content into another's view
        - label: It adds no new top-level command

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Prior art from other Arma or milsim bots, sketches, edge cases you already know about.
